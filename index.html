<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PureTuber YouTube Player</title>
    <style id="youis-adblock">
        /* Kỹ thuật Chặn Quảng Cáo & Overlays từ ka3m (Karaoke 3 Miền) */
        .ytp-ad-text-overlay, .ytp-ad-overlay-container, .ytp-ad-preview-container,
        .ytp-ad-skip-button-container, .ytp-ad-player-overlay, .ytp-ad-progress,
        .ytp-ad-image-overlay, .ytp-ad-overlay-slot, .ytp-ad-visit-advertiser-button,
        .ytp-ad-feedback-dialog, .ytp-ad-persistent-progress-bar-container,
        .video-ads, .ytp-suggestion-set, .ytp-endscreen-previous, .ytp-endscreen-content,
        .ytp-ce-element, .ytp-cards-teaser, .annotation, .iv-drawer {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f0f0f;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 0, 0, 0.2);
            border-top-color: #ff0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            margin-top: 14px;
            font-size: 13px;
            color: #aaaaaa;
            font-weight: 500;
        }
        .error-msg {
            display: none;
            position: fixed;
            inset: 0;
            background: #0f0f0f;
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .error-msg.show { display: flex; }
        .error-msg h2 { font-size: 16px; margin-bottom: 8px; color: #ff4d4d; }
        .error-msg p { font-size: 13px; color: #888; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Đang tải video không quảng cáo...</div>
    </div>
    
    <div id="error-box" class="error-msg">
        <h2>Không tìm thấy Video ID</h2>
        <p>Vui lòng truyền tham số ?v=VIDEO_ID hợp lệ trên URL.</p>
    </div>

    <div id="player-container">
        <div id="player"></div>
    </div>

    <script>
        // 1. Lấy Video ID từ URL parameter ?v=...
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');

        if (!videoId || videoId.length !== 11) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error-box').classList.add('show');
        } else {
            // 2. Nạp YouTube IFrame Player API chuẩn với Origin tự động
            var tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            var firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

            var player;
            function onYouTubeIframeAPIReady() {
                player = new YT.Player('player', {
                    videoId: videoId,
                    host: 'https://www.youtube-nocookie.com',
                    playerVars: {
                        'autoplay': 1,
                        'playsinline': 1,
                        'enablejsapi': 1,
                        'rel': 0,
                        'modestbranding': 1,
                        'controls': 1,
                        'fs': 1,
                        'origin': window.location.origin
                    },
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange,
                        'onError': onPlayerError
                    }
                });
            }

            function onPlayerReady(event) {
                event.target.playVideo();
                setTimeout(function() {
                    document.getElementById('loading').classList.add('hidden');
                }, 300);
            }

            function onPlayerStateChange(event) {
                if (event.data === YT.PlayerState.PLAYING) {
                    document.getElementById('loading').classList.add('hidden');
                }
            }

            function onPlayerError(event) {
                console.error("YouTube Player Error:", event.data);
                document.getElementById('loading').classList.add('hidden');
                // Fallback nếu IFrame API bị chặn
                var container = document.getElementById('player-container');
                container.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + videoId + '?autoplay=1&playsinline=1&enablejsapi=1&rel=0&modestbranding=1&controls=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
            }
        }

        // 3. Tự động tìm & xoá phần tử quảng cáo / tự động bấm "Bỏ qua quảng cáo" (Skip Ad)
        setInterval(function() {
            try {
                const ads = document.querySelectorAll(
                    '.ytp-ad-text-overlay, .ytp-ad-overlay-container, .ytp-ad-preview-container, ' +
                    '.ytp-ad-skip-button-container, .ytp-ad-player-overlay, .ytp-ad-progress, ' +
                    '.ytp-ad-image-overlay, .ytp-ad-overlay-slot, .video-ads, .ytp-ad-skip-button'
                );
                ads.forEach(function(el) { el.remove(); });
                
                const skipBtn = document.querySelector('.ytp-ad-skip-button, .ytp-ad-skip-button-modern');
                if (skipBtn) skipBtn.click();
            } catch(e) {}
        }, 500);
    </script>
</body>
</html>
