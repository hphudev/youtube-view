<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube Ad-Free Player</title>
    
    <style id="youis-adblock">
        /* Tầng 1: CSS Blocker - Ẩn hoàn toàn tất cả container quảng cáo & overlays */
        .ytp-ad-text-overlay, .ytp-ad-overlay-container, .ytp-ad-preview-container,
        .ytp-ad-skip-button-container, .ytp-ad-player-overlay, .ytp-ad-progress,
        .ytp-ad-image-overlay, .ytp-ad-overlay-slot, .ytp-ad-visit-advertiser-button,
        .ytp-ad-feedback-dialog, .ytp-ad-persistent-progress-bar-container,
        .video-ads, .ytp-suggestion-set, .ytp-endscreen-previous, .ytp-endscreen-content,
        .ytp-ce-element, .ytp-cards-teaser, .annotation, .iv-drawer, .ytp-ad-module,
        .ytp-ad-overlay-image, .ad-showing, .ad-container, #player-ads {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
        }
        .error-msg {
            display: none;
            position: fixed;
            inset: 0;
            background: #0f0f0f;
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .error-msg.show { display: flex; }
        .error-msg h2 { font-size: 16px; margin-bottom: 8px; color: #ff4d4d; }
        .error-msg p { font-size: 13px; color: #888; }
    </style>

    <script>
        // Tầng 2: Payload Filter - Bắt & bóc tách JSON quảng cáo từ YouTube InnerTube API
        (function() {
            'use strict';
            const originalFetch = window.fetch;
            if (originalFetch) {
                window.fetch = async function(...args) {
                    const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
                    if (url.includes('/api/stats/ads') || url.includes('/pagead/') || url.includes('/ptracking') || url.includes('/get_midroll_')) {
                        return new Response('', { status: 200, statusText: 'OK' });
                    }
                    const response = await originalFetch.apply(this, args);
                    if (url.includes('/youtubei/v1/player')) {
                        try {
                            const clone = response.clone();
                            const json = await clone.json();
                            if (json) {
                                delete json.adPlacements;
                                delete json.playerAds;
                                delete json.adSlots;
                                if (json.playbackTracking) {
                                    delete json.playbackTracking.atrUrl;
                                    delete json.playbackTracking.videostatsAdUrl;
                                }
                                return new Response(JSON.stringify(json), {
                                    status: response.status,
                                    statusText: response.statusText,
                                    headers: response.headers
                                });
                            }
                        } catch(e) {}
                    }
                    return response;
                };
            }

            const XHR = XMLHttpRequest.prototype;
            const open = XHR.open;
            const send = XHR.send;

            XHR.open = function(method, url) {
                this._url = url;
                return open.apply(this, arguments);
            };

            XHR.send = function(postData) {
                if (this._url && (this._url.includes('/api/stats/ads') || this._url.includes('/pagead/') || this._url.includes('/ptracking') || this._url.includes('/get_midroll_'))) {
                    Object.defineProperty(this, 'status', { value: 200 });
                    Object.defineProperty(this, 'responseText', { value: '' });
                    this.dispatchEvent(new Event('load'));
                    return;
                }
                return send.apply(this, arguments);
            };
        })();
    </script>
</head>
<body>
    <div id="error-box" class="error-msg">
        <h2>Không tìm thấy Video ID</h2>
        <p>Vui lòng truyền tham số ?v=VIDEO_ID hợp lệ trên URL.</p>
    </div>

    <div id="player-container">
        <div id="player"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');

        if (!videoId || videoId.length !== 11) {
            document.getElementById('error-box').classList.add('show');
        } else {
            var tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            var firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

            var player;
            function onYouTubeIframeAPIReady() {
                player = new YT.Player('player', {
                    videoId: videoId,
                    host: 'https://www.youtube-nocookie.com',
                    playerVars: {
                        'autoplay': 1,
                        'playsinline': 1,
                        'enablejsapi': 1,
                        'rel': 0,
                        'modestbranding': 1,
                        'controls': 1,
                        'fs': 1,
                        'origin': window.location.origin
                    },
                    events: {
                        'onReady': function(event) { event.target.playVideo(); },
                        'onError': onPlayerError
                    }
                });
            }

            function onPlayerError(event) {
                console.error("YouTube Player Error:", event.data);
                var container = document.getElementById('player-container');
                container.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + videoId + '?autoplay=1&playsinline=1&enablejsapi=1&rel=0&modestbranding=1&controls=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
            }
        }

        // Tầng 3: Dynamic Ad Sweeper & Speed Skipper - Tự động tua 0.01s qua video quảng cáo & tự động bấm "Skip Ad"
        setInterval(function() {
            try {
                // Tua gấp qua video quảng cáo nếu có quảng cáo lọt lưới
                const video = document.querySelector('video');
                const adShowing = document.querySelector('.ad-showing, .ytp-ad-module');
                if (adShowing && video && !isNaN(video.duration)) {
                    video.currentTime = video.duration;
                }

                // Tự động click Skip Ad
                const skipBtns = document.querySelectorAll('.ytp-ad-skip-button, .ytp-ad-skip-button-modern, .ytp-ad-skip-button-slot');
                skipBtns.forEach(function(btn) { btn.click(); });

                // Dọn dẹp DOM phần tử quảng cáo
                const ads = document.querySelectorAll(
                    '.ytp-ad-text-overlay, .ytp-ad-overlay-container, .ytp-ad-preview-container, ' +
                    '.ytp-ad-skip-button-container, .ytp-ad-player-overlay, .ytp-ad-progress, ' +
                    '.ytp-ad-image-overlay, .ytp-ad-overlay-slot, .video-ads, .ytp-ad-module'
                );
                ads.forEach(function(el) { el.remove(); });
            } catch(e) {}
        }, 300);
    </script>
</body>
</html>
