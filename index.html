<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube Ultra Ad-Free Player</title>
    
    <style id="youis-adblock">
        /* Cốc Cốc / Brave Style CSS - Triệt hạ toàn bộ Quảng cáo & Overlays */
        .ytp-ad-text-overlay, .ytp-ad-overlay-container, .ytp-ad-preview-container,
        .ytp-ad-skip-button-container, .ytp-ad-player-overlay, .ytp-ad-progress,
        .ytp-ad-image-overlay, .ytp-ad-overlay-slot, .ytp-ad-visit-advertiser-button,
        .ytp-ad-feedback-dialog, .ytp-ad-persistent-progress-bar-container,
        .video-ads, .ytp-suggestion-set, .ytp-endscreen-previous, .ytp-endscreen-content,
        .ytp-ce-element, .ytp-cards-teaser, .annotation, .iv-drawer, .ytp-ad-module,
        .ytp-ad-overlay-image, .ad-showing, .ad-container, #player-ads,
        ytd-ad-slot-renderer, ytd-promoted-video-renderer, ytd-display-ad-renderer {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
        }
        .error-msg {
            display: none;
            position: fixed;
            inset: 0;
            background: #0f0f0f;
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .error-msg.show { display: flex; }
        .error-msg h2 { font-size: 16px; margin-bottom: 8px; color: #ff4d4d; }
        .error-msg p { font-size: 13px; color: #888; }
    </style>

    <script>
        // Cơ chế Cốc Cốc / Brave Tầng 1: Lọc dữ liệu API /youtubei/v1/player ngầm
        (function() {
            'use strict';
            const originalFetch = window.fetch;
            if (originalFetch) {
                window.fetch = async function(...args) {
                    const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
                    if (url.includes('/api/stats/ads') || url.includes('/pagead/') || url.includes('/ptracking') || url.includes('/get_midroll_')) {
                        return new Response('', { status: 200, statusText: 'OK' });
                    }
                    const response = await originalFetch.apply(this, args);
                    if (url.includes('/youtubei/v1/player')) {
                        try {
                            const clone = response.clone();
                            const json = await clone.json();
                            if (json) {
                                delete json.adPlacements;
                                delete json.playerAds;
                                delete json.adSlots;
                                if (json.playbackTracking) {
                                    delete json.playbackTracking.atrUrl;
                                    delete json.playbackTracking.videostatsAdUrl;
                                }
                                return new Response(JSON.stringify(json), {
                                    status: response.status,
                                    statusText: response.statusText,
                                    headers: response.headers
                                });
                            }
                        } catch(e) {}
                    }
                    return response;
                };
            }

            const XHR = XMLHttpRequest.prototype;
            const open = XHR.open;
            const send = XHR.send;

            XHR.open = function(method, url) {
                this._url = url;
                return open.apply(this, arguments);
            };

            XHR.send = function(postData) {
                if (this._url && (this._url.includes('/api/stats/ads') || this._url.includes('/pagead/') || this._url.includes('/ptracking') || this._url.includes('/get_midroll_'))) {
                    Object.defineProperty(this, 'status', { value: 200 });
                    Object.defineProperty(this, 'responseText', { value: '' });
                    this.dispatchEvent(new Event('load'));
                    return;
                }
                return send.apply(this, arguments);
            };
        })();
    </script>
</head>
<body>
    <div id="error-box" class="error-msg">
        <h2>Không tìm thấy Video ID</h2>
        <p>Vui lòng truyền tham số ?v=VIDEO_ID hoặc link YouTube hợp lệ.</p>
    </div>

    <div id="player-container">
        <div id="player"></div>
    </div>

    <script>
        function extractVideoId(url) {
            if (!url) return null;
            const str = url.trim();
            if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
            const match = str.match(/(?:[?&]v=|youtu\.be\/|\/embed\/|\/shorts\/)([a-zA-Z0-9_-]{11})/);
            return match ? match[1] : null;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const rawParam = urlParams.get('v') || window.location.href;
        const videoId = extractVideoId(rawParam);

        if (!videoId) {
            document.getElementById('error-box').classList.add('show');
        } else {
            var tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            var firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

            var player;
            function onYouTubeIframeAPIReady() {
                player = new YT.Player('player', {
                    videoId: videoId,
                    playerVars: {
                        'autoplay': 1,
                        'playsinline': 1,
                        'rel': 0,
                        'origin': window.location.origin
                    },
                    events: {
                        'onReady': function(event) { event.target.playVideo(); },
                        'onError': onPlayerError
                    }
                });
            }

            function onPlayerError(event) {
                console.error("YouTube Player Error:", event.data);
                var container = document.getElementById('player-container');
                container.innerHTML = '<iframe src="https://www.youtube.com/embed/' + videoId + '?autoplay=1&playsinline=1&rel=0&origin=' + encodeURIComponent(window.location.origin) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
            }
        }

        // Cơ chế Cốc Cốc / Brave Tầng 2: 16x Fast-Forward Ad Speed & Auto-Skip (Tua sạch quảng cáo trong 0.01 giây)
        function handleAdFastForward() {
            try {
                const video = document.querySelector('video');
                const adShowing = document.querySelector('.ad-showing, .ad-interrupting, .ytp-ad-player-overlay, .ytp-ad-module');
                
                if (adShowing || (video && video.src && video.src.includes('googlevideo.com/videoplayback') && document.querySelector('.ytp-ad-text'))) {
                    if (video) {
                        video.muted = true;
                        video.playbackRate = 16.0; // Tăng tốc độ phát quảng cáo 16 lần
                        if (!isNaN(video.duration) && isFinite(video.duration) && video.duration > 0) {
                            video.currentTime = video.duration - 0.1; // Nhảy thẳng tới 99.9% giây cuối
                        }
                    }

                    // Tự động bấm nút Bỏ qua quảng cáo
                    const skipBtns = document.querySelectorAll(
                        '.ytp-ad-skip-button, .ytp-ad-skip-button-modern, .ytp-ad-skip-button-slot, ' +
                        '.ytm-ad-skip-button, button[class*="skip-button"]'
                    );
                    skipBtns.forEach(function(btn) {
                        try { btn.click(); } catch(e) {}
                    });
                }

                // Dọn dẹp DOM quảng cáo
                const ads = document.querySelectorAll(
                    '.ytp-ad-text-overlay, .ytp-ad-overlay-container, .ytp-ad-preview-container, ' +
                    '.ytp-ad-skip-button-container, .ytp-ad-player-overlay, .ytp-ad-progress, ' +
                    '.ytp-ad-image-overlay, .ytp-ad-overlay-slot, .video-ads, .ytp-ad-module'
                );
                ads.forEach(function(el) { el.remove(); });
            } catch(e) {}
        }

        // Chạy kiểm tra mỗi 100ms
        setInterval(handleAdFastForward, 100);

        // Đón bắt MutationObserver tức thì khi DOM thay đổi
        try {
            const observer = new MutationObserver(handleAdFastForward);
            observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
        } catch(e) {}
    </script>
</body>
</html>
