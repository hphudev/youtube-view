<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube Ad-Free Player</title>
    <meta name="description" content="Xem video YouTube không quảng cáo">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▶</text></svg>">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}

        /* Player iframe — fullscreen tuyệt đối */
        #player{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .4s ease}
        #player.visible{opacity:1}

        /* Nút đổi nguồn — nhỏ gọn, góc dưới phải, không che player */
        #btn-switch{
            position:fixed;bottom:6px;right:6px;
            width:30px;height:30px;border-radius:50%;
            background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1);
            color:rgba(255,255,255,.55);font-size:15px;
            cursor:pointer;z-index:20;
            display:none;align-items:center;justify-content:center;
            -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
            transition:all .2s ease;
            font-family:inherit;line-height:1;
        }
        #btn-switch.show{display:flex}
        #btn-switch:active{transform:scale(.88);background:rgba(255,255,255,.15)}

        /* Màn hình lỗi — chỉ khi không có video ID */
        #error{
            position:fixed;inset:0;background:#000;
            display:none;flex-direction:column;
            align-items:center;justify-content:center;
            color:#666;font-size:13px;text-align:center;z-index:10;
        }
        #error.show{display:flex}
        #error b{color:#999}
    </style>
</head>
<body>

<iframe id="player" allowfullscreen
    allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;fullscreen">
</iframe>

<button id="btn-switch" title="Đổi nguồn phát">⟳</button>

<div id="error">
    <p>Không tìm thấy Video ID</p>
    <p style="margin-top:6px">Truyền tham số <b>?v=VIDEO_ID</b></p>
</div>

<script>
(function(){
    'use strict';

    /* ══════════════ INSTANCE REGISTRY ══════════════ */
    var PROXIES = [
        {id:'inv1', host:'vid.puffyan.us',         type:'invidious'},
        {id:'inv2', host:'yewtu.be',               type:'invidious'},
        {id:'inv3', host:'inv.nadeko.net',          type:'invidious'},
        {id:'inv4', host:'invidious.nerdvpn.de',    type:'invidious'},
        {id:'inv5', host:'invidious.protokolla.fi', type:'invidious'},
        {id:'inv6', host:'invidious.lunar.icu',     type:'invidious'},
        {id:'pip1', host:'piped.video',             type:'piped'},
        {id:'pip2', host:'piped.adminforge.de',     type:'piped'},
        {id:'pip3', host:'piped.r4fo.com',          type:'piped'},
        {id:'pip4', host:'piped.lunar.icu',         type:'piped'}
    ];
    var YT = {id:'yt', host:'www.youtube-nocookie.com', type:'youtube'};
    var ALL = PROXIES.concat([YT]);
    var CACHE_KEY = 'ytaf_src';
    var RACE_MS  = 3000;  // Deadline: 3 giây cho health-check, sau đó → YouTube

    /* ══════════════ DOM ══════════════ */
    var $player = document.getElementById('player');
    var $btn    = document.getElementById('btn-switch');
    var $error  = document.getElementById('error');
    var curIdx  = -1;

    /* ══════════════ EXTRACT VIDEO ID ══════════════ */
    function extractId(s){
        if(!s) return null;
        s = s.trim();
        if(/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;
        var m = s.match(/(?:[?&]v=|youtu\.be\/|\/embed\/|\/shorts\/|\/live\/|\/v\/)([a-zA-Z0-9_-]{11})/);
        return m ? m[1] : null;
    }

    var qs      = new URLSearchParams(window.location.search);
    var videoId = extractId(qs.get('v')||'') || extractId(window.location.href);
    var startAt = qs.get('t') || qs.get('start') || '';

    if(!videoId){ $error.classList.add('show'); return; }

    /* ══════════════ BUILD EMBED URL ══════════════ */
    function embedUrl(src){
        var u = 'https://'+src.host+'/embed/'+videoId+'?autoplay=1';
        if(src.type==='invidious') u += '&quality=dash&player_style=youtube';
        if(src.type==='youtube')   u += '&rel=0&modestbranding=1';
        if(startAt) u += '&start='+encodeURIComponent(startAt);
        return u;
    }

    /* ══════════════ LOAD SOURCE ══════════════ */
    function load(src){
        $player.classList.remove('visible');
        $player.src = embedUrl(src);
        $player.onload = function(){ $player.classList.add('visible'); };
        try{ localStorage.setItem(CACHE_KEY, src.id); }catch(e){}
    }

    /* ══════════════ RACE: no-cors ping ══════════════
       Gửi ping tất cả instances cùng lúc.
       Instance đầu tiên phản hồi → dùng luôn.
       Sau 3 giây không ai trả lời → YouTube fallback. */
    function race(){
        return new Promise(function(resolve){
            var done = false;
            var aborts = [];

            var timer = setTimeout(function(){
                if(!done){ done=true; cleanup(); resolve(null); }
            }, RACE_MS);

            function cleanup(){
                clearTimeout(timer);
                aborts.forEach(function(a){ try{a.abort();}catch(e){} });
            }

            PROXIES.forEach(function(src){
                var ac = new AbortController();
                aborts.push(ac);
                fetch('https://'+src.host+'/', {mode:'no-cors', cache:'no-cache', signal:ac.signal})
                    .then(function(){
                        if(!done){ done=true; cleanup(); resolve(src); }
                    })
                    .catch(function(){});
            });
        });
    }

    /* ══════════════ RETRY BUTTON ══════════════ */
    $btn.addEventListener('click', function(){
        curIdx = (curIdx + 1) % ALL.length;
        load(ALL[curIdx]);
    });

    // Hiện nút sau 4 giây
    setTimeout(function(){ $btn.classList.add('show'); }, 4000);

    /* ══════════════ INIT ══════════════ */
    // 1) Kiểm tra cache
    var cachedId = null;
    try{ cachedId = localStorage.getItem(CACHE_KEY); }catch(e){}
    var cached = cachedId ? ALL.find(function(s){return s.id===cachedId;}) : null;

    if(cached && cached.type !== 'youtube'){
        // Có cache → load ngay lập tức (0 delay)
        curIdx = ALL.indexOf(cached);
        load(cached);

        // Ping cache instance ở background, nếu chết → auto chuyển
        fetch('https://'+cached.host+'/', {mode:'no-cors', cache:'no-cache'})
            .catch(function(){
                // Cache instance chết → race tìm cái mới
                race().then(function(winner){
                    var src = winner || YT;
                    curIdx = ALL.indexOf(src);
                    load(src);
                });
            });
    } else {
        // Không cache → race tất cả instances
        race().then(function(winner){
            var src = winner || YT;
            curIdx = ALL.indexOf(src);
            if(curIdx < 0) curIdx = ALL.length - 1;
            load(src);
        });
    }
})();
</script>
</body>
</html>
